<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress harmless Vite WebSocket / HMR disconnection notifications in AI Studio iframe
      (function() {
        function isViteHmrNoise(args) {
          if (!args || args.length === 0) return false;
          for (let i = 0; i < args.length; i++) {
            const arg = args[i];
            if (typeof arg === 'string') {
              if (
                arg.includes('[vite]') ||
                arg === '[vite]' ||
                arg.includes('failed to connect to websocket') ||
                arg.includes('WebSocket') ||
                arg.includes('websocket') ||
                arg.includes('vite-plugin-pwa')
              ) {
                return true;
              }
            } else if (arg && typeof arg === 'object') {
              const msg = arg.message || arg.reason || '';
              if (
                typeof msg === 'string' &&
                (msg.includes('[vite]') ||
                 msg.includes('WebSocket') ||
                 msg.includes('websocket') ||
                 msg.includes('failed to connect to websocket') ||
                 msg.includes('vite-plugin-pwa'))
              ) {
                return true;
              }
              if (arg.target && (arg.target instanceof WebSocket || Object.prototype.toString.call(arg.target).includes('WebSocket'))) {
                return true;
              }
            }
          }
          return false;
        }

        const origError = console.error;
        console.error = function(...args) {
          if (isViteHmrNoise(args)) {
            console.debug('[vite-notice-ignored]', ...args);
            return;
          }
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (isViteHmrNoise(args)) {
            console.debug('[vite-notice-ignored]', ...args);
            return;
          }
          origWarn.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          const msg = e && (e.message || (e.error && e.error.message)) || '';
          if (
            typeof msg === 'string' &&
            (msg.includes('WebSocket') ||
             msg.includes('websocket') ||
             msg.includes('[vite]') ||
             msg.includes('vite-plugin-pwa'))
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const reason = e && (e.reason && (e.reason.message || String(e.reason))) || '';
          if (
            typeof reason === 'string' &&
            (reason.includes('WebSocket') ||
             reason.includes('websocket') ||
             reason.includes('[vite]') ||
             reason.includes('vite-plugin-pwa'))
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
